<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9FF85"/>
      <stop offset="55%" stop-color="#C8FF4D"/>
      <stop offset="100%" stop-color="#9FE63A"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1A1A1F"/>
      <stop offset="60%" stop-color="#0F0F12"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9FF85"/>
      <stop offset="100%" stop-color="#9FE63A"/>
    </linearGradient>
  </defs>

  <!-- Rounded square -->
  <rect x="0" y="0" width="800" height="800" rx="160" ry="160" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="752" rx="140" ry="140" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>

  <!-- Tennis ball -->
  <circle cx="400" cy="400" r="240" fill="url(#ball)"/>
  <ellipse cx="330" cy="310" rx="120" ry="80" fill="rgba(255,255,255,.08)"/>

  <!-- TW monogram as outlines (no font dependency) -->
  <g fill="url(#letters)">
    <path d="M225 289 H420 L404 337 H333 L286 528 H234 L280 337 H200 Z"/>
    <path d="M353 359 H404 L419 429 L489 288 L519 417 L566 288 H614 L530 528 H500 L473 416 L417 528 H392 Z"/>
  </g>
</svg>
